[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-capabilities-demo"
version = "0.1.0"
description = "A runnable Python LangGraph capability lab"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
lg-demo = "langgraph_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
